[general]
import = [
    "themes/my_onedark.toml"
]

[env]
TERM = "xterm-256color"

[window]
dimensions = { columns = 128, lines = 32 }
opacity = 0.85

[font]
normal = { family = "JetbrainsMono Nerd Font", style = "Regular" }
size = 12

[terminal]
shell = { program = "wsl.exe", args = ["--cd", "~"] }
